services:
  siakad:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siakad-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - siakad-data:/app/public/data
      - siakad-logs:/app/public/logs
      - siakad-uploads:/app/public/uploads
    environment:
      - TZ=Asia/Jakarta
      - SERVER_NAME=:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/index.php?page=health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  siakad-data:
    driver: local
  siakad-logs:
    driver: local
  siakad-uploads:
    driver: local
