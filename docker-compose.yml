version: '3.9'

services:
  siakad:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siakad-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - siakad-data:/var/www/html/data
      - siakad-logs:/var/www/html/logs
      - siakad-uploads:/var/www/html/uploads
    environment:
      - TZ=Asia/Jakarta
      - DB_PATH=/var/www/html/data/siakad.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.php?page=health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  siakad-data:
    driver: local
  siakad-logs:
    driver: local
  siakad-uploads:
    driver: local
