services:
  siakad:
    build: .
    container_name: siakad-app
    ports:
      - "8080:80"
    volumes:
      - siakad-data:/var/www/html/data
      - siakad-logs:/var/www/html/logs
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.php?page=health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  siakad-data:
  siakad-logs:
